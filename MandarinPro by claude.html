a",st:"如果+kondisi，就+hasil",e1z:"如果合同不签，就不能开工。",e1i:"Jika kontrak tidak ditandatangani, maka tidak bisa mulai bekerja.",e2z:"如果你不明白条款，就可以提问。",e2i:"Jika kamu tidak mengerti klausulnya, maka bisa bertanya."},{id:"4",p:"不但...而且",py:"búdàn...érqiě",l:"HSK 3",c:"Penambahan",ex:"tidak hanya...tetapi juga",st:"不但+A，而且+B（甚至C）",e1z:"这个工程师不但会说英语，而且会说普通话。",e1i:"Insinyur ini tidak hanya bisa berbicara Bahasa Inggris, tetapi juga bisa berbicara Mandarin.",e2z:"这份合同不但条款清晰，而且价格合理。",e2i:"Kontrak ini tidak hanya klausulnya jelas, tetapi juga harganya wajar."},{id:"5",p:"越来越",py:"yuè lái yuè",l:"HSK 3",c:"Derajat",ex:"semakin lama semakin",st:"越来越+adjektif/verba",e1z:"建筑材料的价格越来越高，影响了造价。",e1i:"Harga material bangunan semakin lama semakin tinggi, mempengaruhi biaya konstruksi.",e2z:"他的普通话越来越好，现在可以独立谈判了。",e2i:"Mandarinnya semakin lama semakin baik, sekarang sudah bisa negosiasi secara mandiri."},{id:"6",p:"越...越...",py:"yuè...yuè...",l:"HSK 4",c:"Korelasi",ex:"semakin...semakin...",st:"越+A，越+B",e1z:"合同条款越清楚，纠纷越少。",e1i:"Semakin jelas klausul kontrak, semakin sedikit sengketa.",e2z:"工程量越大，施工难度越高。",e2i:"Semakin besar volume pekerjaan, semakin tinggi kesulitan konstruksi."},{id:"7",p:"把",py:"bǎ",l:"HSK 4",c:"Tata bahasa",ex:"konstruksi 把 (disposal)",st:"主语+把+宾语+动词+补语",e1z:"请把报价单发给我们的采购部门。",e1i:"Harap kirimkan lembar penawaran kepada departemen pengadaan kami.",e2z:"他把合同条款修改了三次。",e2i:"Dia merevisi klausul kontrak tiga kali."},{id:"8",p:"被",py:"bèi",l:"HSK 4",c:"Tata bahasa",ex:"kalimat pasif (passive voice)",st:"主语+被+(施事者)+动词+补语",e1z:"合同已经被双方签署确认。",e1i:"Kontrak sudah ditandatangani dan dikonfirmasi oleh kedua pihak.",e2z:"材料验收被暂停，等待质量报告。",e2i:"Penerimaan material dihentikan sementara, menunggu laporan kualitas."},{id:"9",p:"只有...才",py:"zhǐyǒu...cái",l:"HSK 4",c:"Kondisional",ex:"hanya jika...baru bisa",st:"只有+syarat，才+hasil",e1z:"只有按时完成整改，才能通过验收。",e1i:"Hanya jika perbaikan selesai tepat waktu, baru bisa lulus inspeksi.",e2z:"只有掌握好普通话，才能顺利谈判。",e2i:"Hanya jika menguasai Mandarin dengan baik, baru bisa negosiasi dengan lancar."},{id:"10",p:"只要...就",py:"zhǐyào...jiù",l:"HSK 4",c:"Kondisional",ex:"asalkan...maka",st:"只要+syarat，就+hasil",e1z:"只要按照合同条款执行，就不会有问题。",e1i:"Asalkan dilaksanakan sesuai klausul kontrak, maka tidak akan ada masalah.",e2z:"只要质量达标，我们就接受这批货。",e2i:"Asalkan kualitas memenuhi standar, kami akan menerima batch barang ini."},{id:"11",p:"即使...也",py:"jíshǐ...yě",l:"HSK 4",c:"Konsesif",ex:"sekalipun...tetap",st:"即使+kondisi，也+hasil",e1z:"即使工期延误，我们也不能降低质量标准。",e1i:"Sekalipun jadwal terlambat, kami tetap tidak boleh menurunkan standar kualitas.",e2z:"即使报价最低，也要确认质量符合要求。",e2i:"Sekalipun penawaran paling rendah, tetap harus memastikan kualitas memenuhi persyaratan."},{id:"12",p:"尽管...还是/仍然",py:"jǐnguǎn...háishi/réngrán",l:"HSK 4",c:"Konsesif",ex:"walaupun...tetap saja",st:"尽管+A，还是/仍然+B",e1z:"尽管遇到困难，项目仍然按时完成。",e1i:"Walaupun menghadapi kesulitan, proyek tetap diselesaikan tepat waktu.",e2z:"尽管价格谈判很艰难，双方还是达成了协议。",e2i:"Walaupun negosiasi harga sangat sulit, kedua pihak tetap mencapai kesepakatan."},{id:"13",p:"既然...就",py:"jìrán...jiù",l:"HSK 4",c:"Kausal logis",ex:"karena sudah...maka sebaiknya",st:"既然+situasi sudah jelas，就+kesimpulan",e1z:"既然合同已经签了，就要严格执行。",e1i:"Karena kontrak sudah ditandatangani, maka harus dilaksanakan dengan ketat.",e2z:"既然你是专业量师，就给我们一个准确的估价。",e2i:"Karena kamu adalah QS profesional, maka berikan kami estimasi yang akurat."},{id:"14",p:"无论/不管...都",py:"wúlùn/bùguǎn...dōu",l:"HSK 4",c:"Universal",ex:"tidak peduli...semua",st:"无论+kondisi，都+hasil",e1z:"无论天气如何，施工安全必须保障。",e1i:"Tidak peduli bagaimana cuacanya, keselamatan konstruksi harus dijamin.",e2z:"不管价格怎么变，质量标准不能降低。",e2i:"Tidak peduli bagaimana harga berubah, standar kualitas tidak boleh diturunkan."},{id:"15",p:"除了...之外(还/也)",py:"chúle...zhīwài",l:"HSK 4",c:"Penambahan/pengecualian",ex:"selain...juga / kecuali...",st:"除了+A，(还/也)+B / 除了+A，都+B",e1z:"除了工程量清单，还需要提交技术方案。",e1i:"Selain Bill of Quantities, juga perlu menyerahkan rencana teknis.",e2z:"除了这家供应商之外，我们也联系了其他三家。",e2i:"Selain pemasok ini, kami juga menghubungi tiga pemasok lainnya."},{id:"16",p:"为了",py:"wèile",l:"HSK 3",c:"Tujuan",ex:"demi / untuk / dalam rangka",st:"为了+tujuan，主语+动词",e1z:"为了降低成本，我们比较了十家供应商的报价。",e1i:"Demi mengurangi biaya, kami membandingkan penawaran dari sepuluh pemasok.",e2z:"为了赶工期，工地实行两班制施工。",e2i:"Demi mengejar jadwal, lokasi konstruksi menerapkan sistem dua shift."},{id:"17",p:"由于",py:"yóuyú",l:"HSK 4",c:"Sebab formal",ex:"karena / disebabkan oleh (formal)",st:"由于+sebab，主语+hasil",e1z:"由于不可抗力，工期顺延三个月。",e1i:"Karena force majeure, jadwal diperpanjang tiga bulan.",e2z:"由于材料短缺，部分工程被迫暂停。",e2i:"Karena kekurangan material, sebagian pekerjaan terpaksa dihentikan sementara."},{id:"18",p:"连...都/也",py:"lián...dōu/yě",l:"HSK 4",c:"Penekanan",ex:"bahkan...pun",st:"连+objek，都/也+动词",e1z:"连合同的基本条款他都没有看清楚。",e1i:"Bahkan klausul dasar kontrak pun tidak dia baca dengan jelas.",e2z:"这个项目连最有经验的工程师也觉得很难。",e2i:"Proyek ini bahkan insinyur yang paling berpengalaman pun merasa sangat sulit."},{id:"19",p:"是...的",py:"shì...de",l:"HSK 4",c:"Penekanan waktu/cara",ex:"yang... (penekanan)",st:"主语+是+[waktu/cara/tempat]+动词+的",e1z:"这份合同是昨天下午签订的。",e1i:"Kontrak ini (yang) ditandatangani kemarin sore.",e2z:"工程量清单是用BIM软件计算的。",e2i:"Bill of Quantities ini (yang) dihitung menggunakan software BIM."},{id:"20",p:"宁可...也不",py:"nìngkě...yě bù",l:"HSK 5",c:"Preferensi",ex:"lebih baik...daripada...",st:"宁可+A，也不+B",e1z:"我们宁可工期延误，也不能降低施工质量。",e1i:"Kami lebih baik jadwal terlambat daripada harus menurunkan kualitas konstruksi.",e2z:"宁可多花一点钱，也不要选择劣质材料。",e2i:"Lebih baik mengeluarkan uang lebih banyak daripada memilih material berkualitas rendah."},{id:"21",p:"与其...不如",py:"yǔqí...bùrú",l:"HSK 5",c:"Perbandingan",ex:"daripada...lebih baik...",st:"与其+A，不如+B",e1z:"与其一直等待，不如主动联系供应商。",e1i:"Daripada terus menunggu, lebih baik aktif menghubungi pemasok.",e2z:"与其争论条款，不如双方坐下来协商。",e2i:"Daripada berdebat tentang klausul, lebih baik kedua pihak duduk dan bernegosiasi."},{id:"22",p:"之所以...是因为",py:"zhī suǒyǐ...shì yīnwèi",l:"HSK 5",c:"Penjelasan kausal",ex:"alasan mengapa...adalah karena",st:"之所以+akibat，是因为+sebab",e1z:"项目之所以延误，是因为甲方图纸提供太晚。",e1i:"Alasan mengapa proyek terlambat adalah karena pihak pertama terlambat menyediakan gambar.",e2z:"他之所以能通过HSK5，是因为坚持每天学习。",e2i:"Alasan mengapa dia bisa lulus HSK 5 adalah karena konsisten belajar setiap hari."},{id:"23",p:"反而",py:"fǎn'ér",l:"HSK 5",c:"Kontras",ex:"malah / sebaliknya / justru",st:"(tidak diharapkan)，反而+hasil berlawanan",e1z:"材料成本下降了，总造价反而增加了。",e1i:"Biaya material turun, tapi total biaya konstruksi malah meningkat.",e2z:"增加了工人数量，工作效率反而降低了。",e2i:"Jumlah pekerja ditambah, tapi efisiensi kerja malah menurun."},{id:"24",p:"竟然",py:"jìngrán",l:"HSK 5",c:"Kejutan",ex:"ternyata / sungguh mengejutkan",st:"主语+竟然+predikat(mengejutkan)",e1z:"这家公司竟然在投标截止前一天撤标了。",e1i:"Perusahaan ini ternyata menarik diri dari tender satu hari sebelum batas waktu.",e2z:"他竟然用普通话独立完成了整个谈判。",e2i:"Dia ternyata berhasil menyelesaikan seluruh negosiasi secara mandiri menggunakan Mandarin."},{id:"25",p:"何况",py:"hékuàng",l:"HSK 5",c:"Penguatan",ex:"apalagi / lebih-lebih lagi",st:"A，何况B（B lebih ekstrem dari A）",e1z:"普通员工要遵守规定，何况是管理层。",e1i:"Karyawan biasa harus mematuhi peraturan, apalagi manajemen.",e2z:"一个简单的工程都需要规划，何况这么大的项目。",e2i:"Bahkan proyek sederhana pun perlu perencanaan, apalagi proyek sebesar ini."},{id:"26",p:"从而",py:"cóng'ér",l:"HSK 5",c:"Konsekuensi",ex:"dengan demikian / sehingga / oleh karena itu (formal)",st:"原因/方法，从而+hasil",e1z:"通过优化施工方案，从而降低了工程成本。",e1i:"Melalui optimasi rencana konstruksi, dengan demikian berhasil menurunkan biaya pekerjaan.",e2z:"签订长期供货合同，从而稳定了材料供应。",e2i:"Dengan menandatangani kontrak pengiriman jangka panjang, dengan demikian menstabilkan pasokan material."},{id:"27",p:"否则",py:"fǒuzé",l:"HSK 4",c:"Kondisional negatif",ex:"jika tidak / kalau tidak",st:"A，否则+konsekuensi negatif",e1z:"必须在截止日期前提交，否则投标无效。",e1i:"Harus diserahkan sebelum batas waktu, jika tidak maka penawaran tidak berlaku.",e2z:"请及时整改质量问题，否则将面临罚款。",e2i:"Harap segera perbaiki masalah kualitas, jika ti
